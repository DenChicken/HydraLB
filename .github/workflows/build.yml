name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild_externals:
        description: "Rebuild DPDK from scratch"
        type: boolean
        default: false

env:
  DPDK_CACHE_PATHS: |
    build/externals/dpdk-build
    build/externals/dpdk-install

jobs:
  externals:
    name: Build Externals
    runs-on: ubuntu-24.04

    outputs:
      dpdk-key: ${{ steps.dpdk-sha.outputs.key }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve DPDK Cache Key
        id: dpdk-sha
        run: |
          suffix=""
          if [[ "${{ inputs.rebuild_externals }}" == "true" ]]; then
            suffix="-rebuild-${{ github.run_id }}"
          fi
          echo "key=${{ runner.os }}-dpdk-$(git rev-parse HEAD:externals/dpdk)${suffix}" \
            >> "$GITHUB_OUTPUT"

      - name: Restore DPDK Cache
        id: cache-dpdk
        uses: actions/cache@v4
        with:
          path: ${{ env.DPDK_CACHE_PATHS }}
          key: ${{ steps.dpdk-sha.outputs.key }}

      - name: Install System Deps
        if: steps.cache-dpdk.outputs.cache-hit != 'true'
        run: |
          sudo bash scripts/install_deps_ubuntu.sh
          sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*

      - name: Build DPDK
        if: steps.cache-dpdk.outputs.cache-hit != 'true'
        run: bash scripts/build_dpdk.sh

  build:
    name: Build
    needs: externals
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore DPDK Cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DPDK_CACHE_PATHS }}
          key: ${{ needs.externals.outputs.dpdk-key }}
          fail-on-cache-miss: true

      - name: Install System Deps
        run: |
          sudo bash scripts/install_deps_ubuntu.sh
          sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*

      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.2.0'

      - name: Configure and Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel $(nproc)

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            build/HydraLB
            build/hydralb_tests
            build/pcap
          retention-days: 7

  tests:
    name: Tests
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download Binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: build

      - name: Restore Executable Permissions
        run: chmod +x build/HydraLB build/hydralb_tests

      - name: Unit Tests
        working-directory: build
        run: ./hydralb_tests
