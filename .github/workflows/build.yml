name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install System Deps
      run: |
        chmod +x scripts/install_deps_ubuntu.sh
        sudo ./scripts/install_deps_ubuntu.sh
        sudo apt-get clean && sudo rm -rf /var/lib/apt/lists/*

    - uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '4.2.0'

    - name: Cache DPDK Externals
      id: cache-ext
      uses: actions/cache@v4
      with:
        path: |
          build/externals/dpdk-build
          build/externals/dpdk-install
        key: ${{ runner.os }}-dpdk-${{ hashFiles('.git/modules/externals/dpdk/HEAD') }}
        restore-keys: |
          ${{ runner.os }}-dpdk-

    - name: Build Externals
      if: steps.cache-ext.outputs.cache-hit != 'true'
      run: |
        mkdir -p build/externals
        chmod +x scripts/build_dpdk.sh
        bash scripts/build_dpdk.sh

    - name: Configure and Build
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build --parallel $(nproc)
