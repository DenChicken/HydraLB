name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNNER_IMAGE: ubuntu-26.04
  CMAKE_VERSION: '4.2.3'
  CTEST_TIMEOUT: '60'
  EXTERNALS_PATHS: |
    build/externals/dpdk-build
    build/externals/dpdk-install

jobs:
  externals:
    name: Externals
    runs-on: ubuntu-26.04

    outputs:
      cache-key: ${{ steps.key.outputs.value }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Resolve Cache Key
        id: key
        run: |
          recipe="${{ hashFiles('scripts/build_dpdk.sh', 'scripts/install_deps_ubuntu.sh') }}"
          sources="$(git rev-parse HEAD:externals/dpdk)"
          echo "value=${{ env.RUNNER_IMAGE }}-dpdk-${recipe}-${sources}" >> "$GITHUB_OUTPUT"

      - name: Restore Externals
        id: restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.EXTERNALS_PATHS }}
          key: ${{ steps.key.outputs.value }}
          lookup-only: true

      - name: Install Dependencies
        if: steps.restore.outputs.cache-hit != 'true'
        run: sudo bash scripts/install_deps_ubuntu.sh

      - name: Build DPDK
        if: steps.restore.outputs.cache-hit != 'true'
        run: bash scripts/build_dpdk.sh

      - name: Save Externals
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.EXTERNALS_PATHS }}
          key: ${{ steps.key.outputs.value }}

  build:
    name: Build
    needs: externals
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build
        uses: ./.github/actions/build
        with:
          externals-key: ${{ needs.externals.outputs.cache-key }}
          externals-paths: ${{ env.EXTERNALS_PATHS }}
          cmake-version: ${{ env.CMAKE_VERSION }}
          targets: HydraLB

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: |
            build/HydraLB
            build/hydralb_unit_tests
            build/hydralb_integration_tests
            build/pcap
          retention-days: 7

  tests:
    name: Tests
    needs: externals
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build
        uses: ./.github/actions/build
        with:
          externals-key: ${{ needs.externals.outputs.cache-key }}
          externals-paths: ${{ env.EXTERNALS_PATHS }}
          cmake-version: ${{ env.CMAKE_VERSION }}
          targets: hydralb_unit_tests hydralb_integration_tests

      - name: Tests
        run: ctest --test-dir build -V --timeout ${{ env.CTEST_TIMEOUT }}
